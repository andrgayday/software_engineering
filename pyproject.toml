[project]
name = "russian-sentiment-api"
version = "0.1.0"
description = "FastAPI API for Russian text sentiment analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "transformers>=4.45,<5.0",
    "torch>=2.6,<2.7",
    "scikit-learn",
    "dishka",
    "loguru",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
    "matplotlib>=3.9,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
